  #     - fromService: { type: web, name: mynews-api, envVarKey: DATABASE_URL }
  #     - fromService: { type: web, name: mynews-api, envVarKey: ANTHROPIC_API_KEY }
  #     - fromService: { type: web, name: mynews-api, envVarKey: CONTACT_EMAIL }
