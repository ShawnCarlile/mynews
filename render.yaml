# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the public API. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: mynews-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: MAX_SUMMARIES_PER_RUN
        value: "40"

  # Optional paid alternative to the GitHub Actions schedule ($1/month minimum on Render).
  # Uncomment to run the collector directly against the database every hour at :05.
  # - type: cron
  #   name: mynews-hourly-collect
  #   runtime: node
  #   rootDir: server
  #   schedule: "5 * * * *"
